<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>$GODOT_PROJECT_NAME</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: #e6d5a8;
	background-color: #0d1510;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status {
	position: absolute;
	inset: 0;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	gap: 1.4rem;
	background: radial-gradient(ellipse at 50% 60%, #16261c 0%, #0d1510 60%, #070c09 100%);
	font-family: 'Cinzel', 'Trajan Pro', 'Palatino Linotype', Georgia, serif;
	text-align: center;
	visibility: hidden;
	transition: opacity 0.4s ease;
	z-index: 2;
}

#status.fade {
	opacity: 0;
}

#status-title {
	margin: 0;
	font-size: clamp(2rem, 7vw, 4.6rem);
	font-weight: 400;
	letter-spacing: 0.12em;
	color: #b8923f;
	text-shadow: 0 0 18px rgba(184, 146, 63, 0.35), 0 3px 0 #1a120a;
}

#status-subtitle {
	margin: -0.6rem 0 0.8rem;
	font-size: clamp(0.9rem, 2.4vw, 1.3rem);
	letter-spacing: 0.3em;
	text-transform: uppercase;
	color: #7fa38c;
}

#status-progress {
	width: min(32rem, 78vw);
	height: 0.9rem;
	padding: 3px;
	border: 2px solid #6e5129;
	background: #161712;
	box-sizing: border-box;
}

#status-fill {
	height: 100%;
	width: 0%;
	background: linear-gradient(90deg, #3e8e6a, #b8923f);
	box-shadow: 0 0 10px rgba(184, 146, 63, 0.45);
	transition: width 0.2s linear;
}

#status-progress.indeterminate #status-fill {
	width: 30%;
	animation: sweep 1.2s ease-in-out infinite alternate;
}

@keyframes sweep {
	from { transform: translateX(0); }
	to { transform: translateX(233%); }
}

#status-text {
	font-size: 0.95rem;
	letter-spacing: 0.12em;
	color: #cdbb8c;
	min-height: 1.2em;
}

#status-tip {
	max-width: min(34rem, 86vw);
	font-family: Georgia, 'Times New Roman', serif;
	font-style: italic;
	font-size: 0.95rem;
	color: rgba(230, 213, 168, 0.6);
	transition: opacity 0.5s ease;
}

.mote {
	position: absolute;
	width: 4px;
	height: 4px;
	border-radius: 50%;
	background: #cfe8a0;
	box-shadow: 0 0 8px 2px rgba(190, 230, 140, 0.6);
	opacity: 0;
	animation: drift 7s ease-in-out infinite;
	pointer-events: none;
}

@keyframes drift {
	0% { transform: translate(0, 0); opacity: 0; }
	20% { opacity: 0.9; }
	80% { opacity: 0.6; }
	100% { transform: translate(30px, -120px); opacity: 0; }
}

#status-notice {
	display: none;
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	padding: 1rem;
}

@media (prefers-reduced-motion: reduce) {
	.mote { display: none; }
	#status-progress.indeterminate #status-fill { animation: none; width: 100%; opacity: 0.5; }
}
</style>
		$GODOT_HEAD_INCLUDE
	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<h1 id="status-title">Rebound of Ruins</h1>
			<div id="status-subtitle">A tale of the Ruin woods</div>
			<div id="status-progress" class="indeterminate"><div id="status-fill"></div></div>
			<div id="status-text">Gathering the forest&hellip;</div>
			<div id="status-tip"></div>
			<div id="status-notice"></div>
		</div>

		<script src="$GODOT_URL"></script>
		<script>
const GODOT_CONFIG = $GODOT_CONFIG;
const GODOT_THREADS_ENABLED = $GODOT_THREADS_ENABLED;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusFill = document.getElementById('status-fill');
	const statusText = document.getElementById('status-text');
	const statusTip = document.getElementById('status-tip');
	const statusNotice = document.getElementById('status-notice');
	const tips = [
		'Strike as the blade swings through: your hit lands mid-arc.',
		'Big goblins hit harder but swing slower. Keep moving.',
		'Spend gems between rounds to grow stronger.',
		'Lower the Quality setting if the forest feels sluggish.',
	];
	let tipIndex = Math.floor(Math.random() * tips.length);
	statusTip.textContent = tips[tipIndex];
	const tipTimer = setInterval(() => {
		statusTip.style.opacity = '0';
		setTimeout(() => {
			tipIndex = (tipIndex + 1) % tips.length;
			statusTip.textContent = tips[tipIndex];
			statusTip.style.opacity = '1';
		}, 500);
	}, 5000);
	for (let i = 0; i < 14; i++) {
		const m = document.createElement('div');
		m.className = 'mote';
		m.style.left = (5 + Math.random() * 90) + '%';
		m.style.top = (30 + Math.random() * 65) + '%';
		m.style.animationDelay = (Math.random() * 7).toFixed(2) + 's';
		m.style.animationDuration = (5 + Math.random() * 4).toFixed(2) + 's';
		statusOverlay.appendChild(m);
	}

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			clearInterval(tipTimer);
			initializing = false;
			statusOverlay.classList.add('fade');
			setTimeout(() => statusOverlay.remove(), 450);
			return;
		}
		statusOverlay.style.visibility = 'visible';
		const progressMode = mode === 'progress';
		statusProgress.style.display = progressMode ? 'block' : 'none';
		statusText.style.display = progressMode ? 'block' : 'none';
		statusTip.style.display = progressMode ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					const pct = Math.min(100, Math.floor((current / total) * 100));
					statusProgress.classList.remove('indeterminate');
					statusFill.style.width = pct + '%';
					statusText.textContent = pct < 100 ? 'Gathering the forest\u2026 ' + pct + '%' : 'Awakening the ruins\u2026';
				} else {
					statusProgress.classList.add('indeterminate');
					statusText.textContent = 'Awakening the ruins\u2026';
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
